<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#082b67"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-title"
  content="Salud Digestiva"
>


<!-- =========================================================
     APERTURA DESDE EL ICONO INSTALADO
     Se ejecuta antes de mostrar el instalador
     ========================================================= -->

<script>

(function(){

  const params =
    new URLSearchParams(location.search);

  if(params.get("launch") === "1"){

    location.replace(
      "https://salud-digestiva.rkdoepllgs.workers.dev/?v=5"
    );

  }

})();

</script>


<link
  rel="manifest"
  href="manifest.webmanifest"
>

<link
  rel="apple-touch-icon"
  href="icon-192.png"
>

<link
  rel="icon"
  href="icon-192.png"
>


<title>
  Instalar Salud Digestiva
</title>


<style>

*{
  box-sizing:border-box;
}


html,
body{

  margin:0;

  min-height:100%;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#f8fafc;

  color:#082b67;

}


body{

  display:grid;

  place-items:center;

  padding:22px;

}


.card{

  width:min(100%,430px);

  background:#fff;

  border:1px solid #e7ebf0;

  border-radius:24px;

  box-shadow:
    0 14px 40px
    rgba(8,43,103,.12);

  padding:26px;

  text-align:center;

}


.logo{

  width:132px;

  height:132px;

  object-fit:contain;

  margin:0 auto 12px;

}


h1{

  font-size:29px;

  line-height:1.05;

  margin:0 0 8px;

}


.tag{

  font-size:16px;

  color:#536179;

  margin:0 0 22px;

}


.install{

  border:0;

  border-radius:28px;

  background:#ff6816;

  color:#fff;

  width:100%;

  padding:15px 18px;

  font-size:17px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 7px 18px
    rgba(255,104,22,.22);

  transition:
    background .25s ease,
    opacity .25s ease,
    box-shadow .25s ease;

}


.install:disabled{

  cursor:default;

}


/* =========================================================
   ESTADO: INSTALANDO
   ========================================================= */

.install.installing{

  background:#ff6816;

  opacity:1;

  box-shadow:
    0 7px 18px
    rgba(255,104,22,.22);

}


/* =========================================================
   ESTADO: INSTALADO
   ========================================================= */

.install.done{

  background:#18864b;

  opacity:1;

  box-shadow:
    0 7px 18px
    rgba(24,134,75,.22);

}


.open{

  display:block;

  margin-top:12px;

  text-decoration:none;

  border:1px solid #dce3eb;

  border-radius:28px;

  color:#082b67;

  padding:13px 18px;

  font-weight:700;

  background:#fff;

}


.status{

  margin:16px 0 0;

  color:#657187;

  font-size:13px;

  line-height:1.35;

  min-height:36px;

}

</style>

</head>


<body>


<main class="card">


<img
  class="logo"
  src="icon-512.png"
  alt="Salud Digestiva"
>


<h1>
  Salud Digestiva
</h1>


<p class="tag">

  Acceso rápido a nuestros medios de contacto

</p>


<button
  id="installBtn"
  class="install"
  disabled
>

  Preparando instalación…

</button>


<a
  class="open"
  href="https://salud-digestiva.rkdoepllgs.workers.dev/?v=5"
>

  Abrir Salud Digestiva

</a>


<p
  id="status"
  class="status"
>

  Verificando si su navegador permite agregar el acceso directo.

</p>


</main>



<script>


/* =========================================================
   DESTINO PRINCIPAL
   ========================================================= */

const DESTINO =
"https://salud-digestiva.rkdoepllgs.workers.dev/?v=5";



/* =========================================================
   VARIABLES
   ========================================================= */

let deferredPrompt = null;

let instalacionEnProceso = false;

let momentoInicio = 0;

let temporizadorRespaldo = null;



const btn =
document.getElementById(
  "installBtn"
);


const status =
document.getElementById(
  "status"
);



/* =========================================================
   SERVICE WORKER
   ========================================================= */

if(
  "serviceWorker"
  in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          () => {}
        );

    }
  );

}



/* =========================================================
   CHROME INDICA QUE LA APP PUEDE INSTALARSE
   ========================================================= */

window.addEventListener(
  "beforeinstallprompt",
  event => {

    event.preventDefault();

    deferredPrompt =
      event;


    btn.disabled =
      false;


    btn.classList.remove(
      "installing",
      "done"
    );


    btn.textContent =
      "Agregar a pantalla";


    status.textContent =
      "Listo. Toque el botón y luego confirme.";

  }
);



/* =========================================================
   BOTÓN AGREGAR A PANTALLA
   ========================================================= */

btn.addEventListener(
  "click",
  async () => {


    if(
      !deferredPrompt
    ){

      status.innerHTML =
        "Si Chrome no muestra la confirmación automática, " +
        "use el menú <b>⋮</b> y elija " +
        "<b>Agregar a pantalla principal</b>.";

      return;

    }


    try{


      /*
        Guardamos el evento antes de utilizarlo.
      */

      const promptInstalacion =
        deferredPrompt;


      deferredPrompt =
        null;


      /*
        Marcamos desde este momento que hay
        un proceso de instalación activo.

        Así ningún temporizador puede volver a
        cambiar accidentalmente el botón.
      */

      instalacionEnProceso =
        true;


      momentoInicio =
        Date.now();


      /*
        Chrome muestra el cuadro nativo
        donde el usuario pulsa INSTALAR.
      */

      const resultado =
        await promptInstalacion.prompt();



      /* =====================================================
         USUARIO ACEPTÓ INSTALAR
         ===================================================== */

      if(
        resultado.outcome
        === "accepted"
      ){


        /*
          MUY IMPORTANTE:

          Aquí NO decimos "Instalado".

          El usuario solamente aceptó instalar.
          Android todavía puede estar trabajando.
        */


        btn.disabled =
          true;


        btn.classList.remove(
          "done"
        );


        btn.classList.add(
          "installing"
        );


        btn.textContent =
          "Instalando…";


        status.textContent =
          "Espere un momento mientras finalizamos la instalación.";



        /*
          RESPALDO DE SEGURIDAD.

          Si por alguna razón el navegador no envía
          el evento appinstalled, no dejamos al
          usuario atrapado indefinidamente aquí.

          Esperamos 10 segundos.
        */

        temporizadorRespaldo =
          setTimeout(
            () => {


              if(
                !instalacionEnProceso
              ){
                return;
              }


              status.textContent =
                "Instalación aceptada. Abriendo Salud Digestiva…";


              setTimeout(
                () => {

                  location.replace(
                    DESTINO
                  );

                },
                900
              );


            },
            10000
          );


        return;

      }



      /* =====================================================
         USUARIO CANCELÓ
         ===================================================== */

      instalacionEnProceso =
        false;


      btn.disabled =
        false;


      btn.classList.remove(
        "installing",
        "done"
      );


      btn.textContent =
        "Agregar a pantalla";


      status.textContent =
        "Puede intentarlo nuevamente.";


    }


    catch(error){


      instalacionEnProceso =
        false;


      btn.disabled =
        false;


      btn.classList.remove(
        "installing",
        "done"
      );


      btn.textContent =
        "Agregar a pantalla";


      status.textContent =
        "No se pudo completar automáticamente. Puede intentarlo nuevamente.";


    }


  }
);



/* =========================================================
   INSTALACIÓN CONFIRMADA POR EL NAVEGADOR
   ========================================================= */

window.addEventListener(
  "appinstalled",
  () => {


    /*
      Chrome ya confirmó que la aplicación
      fue instalada.

      Sin embargo Android puede tardar todavía
      un pequeño instante en terminar de
      integrarla en el sistema.

      Por eso no mostramos "Instalado ✓"
      inmediatamente.
    */


    instalacionEnProceso =
      false;



    if(
      temporizadorRespaldo
    ){

      clearTimeout(
        temporizadorRespaldo
      );

      temporizadorRespaldo =
        null;

    }



    /*
      Calculamos cuánto tiempo lleva visible
      el proceso desde que comenzó.
    */

    const tiempoTranscurrido =
      Date.now() - momentoInicio;



    /*
      TIEMPO VISUAL MÍNIMO DE INSTALACIÓN

      Queremos que "Instalando…"
      permanezca visible al menos 3.5 segundos.

      Esto evita que nuestra página diga
      "Instalado" mientras Android todavía
      muestra "Instalando Salud Digestiva…".
    */

    const TIEMPO_MINIMO_INSTALACION =
      3500;



    const esperaRestante =
      Math.max(
        0,
        TIEMPO_MINIMO_INSTALACION
        -
        tiempoTranscurrido
      );



    setTimeout(
      () => {


        /* ===================================================
           AHORA SÍ MOSTRAMOS INSTALADO
           =================================================== */


        btn.disabled =
          true;


        btn.classList.remove(
          "installing"
        );


        btn.classList.add(
          "done"
        );


        btn.textContent =
          "Instalado ✓";


        status.textContent =
          "Instalación completada. Abriendo Salud Digestiva…";



        /*
          Dejamos visible la confirmación
          durante 1.1 segundos.

          Después volvemos automáticamente
          a la página principal.
        */

        setTimeout(
          () => {


            location.replace(
              DESTINO
            );


          },
          1100
        );


      },
      esperaRestante
    );


  }
);



/* =========================================================
   RESPALDO INICIAL
   ========================================================= */

setTimeout(
  () => {


    if(
      !deferredPrompt
      &&
      !instalacionEnProceso
    ){


      btn.disabled =
        false;


      btn.classList.remove(
        "installing",
        "done"
      );


      btn.textContent =
        "Agregar a pantalla";


      status.textContent =
        "Toque el botón para intentar agregar el acceso.";


    }


  },
  1800
);


</script>


</body>

</html>
